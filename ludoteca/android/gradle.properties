org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Compilação incremental do Kotlin desligada porque este projeto está no H: e o
# cache do pub (onde ficam os fontes dos plugins) está no C:. O conversor de
# caminhos do compilador incremental chama File.relativeTo entre os dois e
# estoura com "this and base files have different roots" — drives diferentes não
# têm caminho relativo no Windows. O único plugin com Kotlin aqui é o
# share_plus, então o custo é uma recompilação completa de um arquivo.
#
# A alternativa seria mover o projeto para o C: ou apontar PUB_CACHE para o H:.
kotlin.incremental=false

